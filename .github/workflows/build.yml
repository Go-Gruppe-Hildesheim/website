# Check-Name: build
# Baut die Seite bei jedem Pull Request und bei jedem Push auf main.
#
# Warum es das gibt: der Deploy-Workflow baut erst NACH dem Merge. Automatisch
# gemergte Major-Updates sind deshalb ungeprueft auf main gelandet -- hier hat
# der Sprung auf astro 7 die Integration `@astrojs/tailwind` (Peer astro <= 5)
# zerbrochen, `npm ci` starb im Deploy mit ERESOLVE, und die Seite blieb auf
# dem alten Build stehen. Dieser Check faengt so etwas im PR ab, bevor er
# gemergt wird. Er sollte im Ruleset als Pflicht-Check fuer main eingetragen
# sein (dieses Repo hat aktuell kein Ruleset).
#
# Nur `npm ci` und `npm run build` -- mehr Scripts gibt es in diesem Repo
# nicht. `npm ci` ist dabei die eigentliche Falle: es installiert streng nach
# package-lock.json und prueft die Peer-Ranges, wo `npm install` sie noch
# umschreiben wuerde.
name: Build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # package.json verlangt `engines.node: ^22`.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
